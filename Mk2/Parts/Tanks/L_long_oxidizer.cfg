+PART[mk2Fuselage]
{
	@name = mk2FuselageOxidizerOnly
	@author = Lisias, #$author$
	@title = Mk2 Oxidizer Fuselage
	@manufacturer = L Aerospace KSP Division
	@description = #$description$ Oxidizer Only version.
	@tags = aircraft airplane fueltank jet ?oxidizer only plane propellant tank
	@RESOURCE[Oxidizer]
	{
		%amount = 800
		%maxAmount = 800
	}
	-RESOURCE[LiquidFuel] {}
}

@PART[mk2FuselageOxidizerOnly]:FOR[L_Aerospace]
{
	%MODULE[TweakScale]:NEEDS[TweakScale]
	{
		type = stack
		defaultScale = 2.5
	}
}
