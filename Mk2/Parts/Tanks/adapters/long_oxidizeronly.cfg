+PART[mk2_1m_AdapterLong]
{
	@name = mk2_1m_AdapterLong_OxidizerOnly
	@author = Lisias, #$author$
	@title = #$title$ (Oxidizer Only)
	@manufacturer = L Aerospace KSP Division
	@description = #$description$ Oxidizer Only version.
	@tags = fueltank oxidizer propellant tank
	@RESOURCE[Oxidizer]
	{
		%amount = 800
		%maxAmount = 800
	}
	-RESOURCE[LiquidFuel] {}
}

@PART[mk2_1m_AdapterLong_FuelOnly]:FOR[L_Aerospace]
{
	%MODULE[TweakScale]:NEEDS[TweakScale]
	{
		type = stack
		defaultScale = 2.5
	}
}

