+PART[mk2SpacePlaneAdapter]
{
	@name = Mk2SpacePlaneAdapterFuelOnly
	@author = Lisias, #$author$
	@title = #$description$ (Fuel Only)
	@manufacturer = L Aerospace KSP Division
	@description = #$description$, Fuel Only version.
	@tags = fuel fueltank liquid propellant tank
	@RESOURCE[LiquidFuel]
	{
		%amount = 300
		%maxAmount = 300
	}
	-RESOURCE[Oxidizer] {}
}

@PART[Mk2SpacePlaneAdapterFuelOnly]:FOR[L_Aerospace]
{
	%MODULE[TweakScale]:NEEDS[TweakScale]
	{
		type = stack
		defaultScale = 2.5
	}
}
