+PART[mk2_1m_AdapterLong]
{
	@name = mk2_1m_AdapterLong_FuelOnly
	@author = Lisias, #$author$
	@title = #$title$ (Fuel Only)
	@manufacturer = L Aerospace KSP Division
	@description = #$description$ Fuel Only version.
	@tags = fuel fueltank liquid propellant tank
	@RESOURCE[LiquidFuel]
	{
		%amount = 800
		%maxAmount = 800
	}
	-RESOURCE[Oxidizer] {}
}

@PART[mk2_1m_AdapterLong_FuelOnly]:FOR[L_Aerospace]
{
	%MODULE[TweakScale]:NEEDS[TweakScale]
	{
		type = stack
		defaultScale = 2.5
	}
}

