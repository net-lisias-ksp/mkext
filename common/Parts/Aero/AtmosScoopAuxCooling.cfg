+PART[airScoop]
{
	@name = AtmosScoopAuxCooling
	@author = Lisias, #$author$
	-mesh = deleteme
	MODEL
	{
		model = Squad/Parts/Aero/airIntakeRadialXM-G50/RadialIntake
		position = 0.0, 0.0, 0.0
		scale = 1, 0.75, 2.25
	}
	@title = HS-G750 Radial Atmosphere Intake
	@manufacturer = L Aerospace / KSP Division
	@description = An intake duct version that can be mounted at the sides of a fuselage. Warranty does not cover engine flame-outs or any objects, inanimate or otherwise, sucked in by the intake. Optimized for subsonic flight.
	@TechRequired = #$TechRequired$ , hypersonicFlight
	@entryCost = 4500	// 2000 + airScoop (2500)
	@cost = 1390		// 1140 + airScoop (250)
	@mass = 0.30		// Pumps et all
	@maxTemp = 2250		// 250 + airScoop (2000)
	@tags = hypersonic #$tags$

	-MODULE[ModuleResourceIntake] { }
	-RESOURCE[IntakeAir] { }

	MODULE
	{
		name = KerbalHeatDissipatorSuperCharger
		active = true

		// The order of the RESOURCEs are crucial for the Module.
		// The coolant is consumed in the order specified here. If the first ones gets unavailable or not enough, the next of the list is used.
		// Order the resources by the inverse order of scarcity/importance/price
		RESOURCE
		{
			name = IntakeAtmosphere
			// Resources without a consuption implies on consuption = 0, i.e. no consuption.
		}
		// Resources that don't contribute directly to cooling (as EC) should be placed at last to guarantee consuption.
		RESOURCE
		{
			name = ElectricCharge
			consuption = 0.00645	// How much of the resource will be consumed when active for a second at full power
									// while "full power" is imported from the target part.
		}
	}

	-MODULE[ModuleResourceIntake] { }
	MODULE
	{
		name = ModuleResourceIntake
		resourceName = IntakeAtmosphere
		checkForOxygen = true
		area = 0.0031
		intakeSpeed = 50
		intakeTransformName = Intake
		machCurve
		{
			key = 1 1 0 0
			key = 2.0 0.9 -0.4312553 -0.4312553
			key = 3.7 0.45 -0.5275364 -0.5275364
			key = 6.5 0.1 0 0
		}
	}
	RESOURCE
	{
		name = IntakeAtmosphere
		amount = 200
		maxAmount = 200
	}

	// Both KerbalHeatDissipator (and the SuperCharger) are coded to only handle resources present on the part hosting them
	// This matters because heat dissipation can only happen with resources flowing on the disspators, i.e., a cooland on the
	// other side of the vessel needs to be pumped to the dissipator to get cooled.
	//
	// Super Charger are mechanical in Real Life™, but we don't have torque as a source of kinect energy on KSP. So I choose to use
	// EC instead, but then I realized that the code couldn't use it without some heavy refactoring, not to mention some metadata
	// to "explain" that EC should be handled differently (the current implementation allows any resource to be "consumed", even if
	// the HSP is zero, simplyfing the algorithm).
	//
	// So the easiest way out of the problem is just adding a bit of EC to the part. :)
	RESOURCE
	{
		name = ElectricCharge
		amount = 10
		maxAmount = 10
	}
}
