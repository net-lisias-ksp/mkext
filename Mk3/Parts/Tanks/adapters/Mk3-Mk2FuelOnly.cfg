+PART[adapterMk3-Mk2]
{
	@name = adapterMk3-Mk2FuelOnly
	@author = Lisias, #$author$
	@title = #$title$ Fuel Only
	@manufacturer = L Aerospace KSP Division
	@description = #$description$ This tank is for fuel only.
	@tags = fueltank oxidizer propellant tank
	@RESOURCE[LiquidFuel]
	{
		%amount = 2000
		%maxAmount = 2000
	}
	-RESOURCE[Oxidizer] {}
}

@PART[adapterMk3-Mk2FuelOnly]:FOR[L_Aerospace]
{
	%MODULE[TweakScale]:NEEDS[TweakScale]
	{
		type = stack
		defaultScale = 3.75
	}
}
